# Actions are pinned to commit SHAs; this keeps the pins current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Go modules. tailscale.com is a fork through the replace in go.mod: moved by hand.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: tailscale.com
