name: Bug report
description: Something does not work as the README says
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For a security problem, please use [private vulnerability reporting](https://github.com/mh-mobile/reqcove/security/advisories/new) instead.
        Mask tokens, cookies and tailnet names before pasting anything.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The `reqcove run` command line (flags), and what you did on the iPhone.
  - type: textarea
    id: status
    attributes:
      label: Output of `reqcove version` and `reqcove status`
      render: text
  - type: input
    id: env
    attributes:
      label: OS, and how the iPhone connects
      placeholder: macOS 27 on Apple silicon; iPhone on 5G through the exit node
