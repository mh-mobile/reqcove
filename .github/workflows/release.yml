name: release

# Push a tag such as v0.1.0. This builds the Linux binaries and makes a DRAFT
# release; nothing is public until someone publishes the draft. The macOS
# binary is signed and notarized on a Mac by scripts/release-macos.sh, which
# adds it to the draft (the signing key stays in that Mac's keychain).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: read # the check below reads test.yml's runs

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # The tag reaches the shell only as this variable, never expanded into a
      # script: a ref name can hold $(…) and quotes.
      VERSION: ${{ github.ref_name }}
    steps:
      # Only a commit that passed the whole test workflow (macOS and Linux,
      # end to end with mitmproxy, the container, the checks) is released.
      - name: tests passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow test.yml --commit "$GITHUB_SHA" --status success --json databaseId --jq length)
          if [ "$runs" -eq 0 ]; then
            echo "::error::$GITHUB_SHA has no successful run of test.yml: push it to dev or main (or open a pull request), wait for test.yml to pass, then re-run this job"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing here pushes; keep the token out of .git/config
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # a job with write access builds from scratch, not from a cache others can fill
      - run: go vet ./... && go test ./...
      - name: build
        run: |
          set -eu
          mkdir -p dist
          go run github.com/google/go-licenses/v2@v2.0.1 save ./cmd/reqcove --save_path=third_party
          # go-licenses keeps LICENSE files only; Tailscale also has a PATENTS grant.
          cp "$(go list -m -f '{{.Dir}}' tailscale.com)/PATENTS" third_party/tailscale.com/
          for target in linux/amd64 linux/arm64; do
            os=${target%/*} arch=${target#*/}
            name=reqcove_${VERSION#v}_${os}_${arch}
            mkdir -p "build/$name"
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X main.version=$VERSION" -o "build/$name/reqcove" ./cmd/reqcove
            cp LICENSE README.md README.ja.md "build/$name/"
            cp -R third_party "build/$name/third_party_licenses"
            tar -C build -czf "dist/$name.tar.gz" "$name"
          done
          (cd dist && sha256sum *.tar.gz > checksums.txt)
      - name: draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$VERSION" dist/* --draft --generate-notes --title "$VERSION"
