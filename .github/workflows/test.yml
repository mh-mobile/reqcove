name: test

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  # docs_only: every changed path is docs (scripts/ci-docs-only.sh); then the
  # test matrix and the container are skipped (the run still succeeds) and only
  # checks and docs run. Anything uncertain runs everything.
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the push's before and the pull request's base
      - id: diff
        shell: bash # pipefail: a failed script fails the job
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: scripts/ci-docs-only.sh "$EVENT" "$BASE" "$HEAD" | tee -a "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing here pushes; keep the token out of .git/config
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal skills)"
      - run: go vet ./...
      - run: go test -race ./...
      # Every test gated on REQCOVE_E2E, with real mitmproxy from its lock. The
      # memory trial (REQCOVE_TRIAL2) and the soak (REQCOVE_SOAK) stay local:
      # their budgets depend on the machine.
      - name: end to end with mitmproxy
        env:
          REQCOVE_E2E: "1"
        run: go test -count=1 ./internal/capture/ ./internal/exitnode/ ./cmd/reqcove/

  # The container image (Dockerfile), built and run without a tailnet login:
  # mitmproxy offline, reqcove mcp from another container, the lock, docker stop.
  container:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/container-smoke.sh

  # Docs-only changes: the tests that read the docs and SKILL.md (docs_test.go,
  # skill_test.go, setup_test.go) are cmd/reqcove's; the test job runs them otherwise.
  docs:
    needs: changes
    if: needs.changes.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test ./cmd/reqcove/

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      # Fails on a known vulnerability the code can reach.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      # mitmproxy's lock: it matches its launcher, and no package in it has a
      # known vulnerability.
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: mitmproxy lock
        run: uv lock --script internal/capture/mitm.py --check
      - name: pip-audit
        run: |
          uv export --script internal/capture/mitm.py --no-header -q -o "$RUNNER_TEMP/mitm-requirements.txt"
          uvx pip-audit@2.10.1 -r "$RUNNER_TEMP/mitm-requirements.txt" --require-hashes --disable-pip --progress-spinner off
