name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing here pushes; keep the token out of .git/config
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test -race ./...
      # Real mitmproxy through uvx. The memory trial (REQCOVE_TRIAL2) stays local:
      # its RSS budgets depend on the machine.
      - name: end to end with mitmproxy
        env:
          REQCOVE_E2E: "1"
        run: go test -count=1 -run 'TestEndToEnd|TestRules|TestLogsHoldNoSecrets|TestWeb|TestCANamed' ./internal/capture/
