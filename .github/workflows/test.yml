name: test

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing here pushes; keep the token out of .git/config
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal skills)"
      - run: go vet ./...
      - run: go test -race ./...
      # Every test gated on REQCOVE_E2E, with real mitmproxy from its lock. The
      # memory trial (REQCOVE_TRIAL2) and the soak (REQCOVE_SOAK) stay local:
      # their budgets depend on the machine.
      - name: end to end with mitmproxy
        env:
          REQCOVE_E2E: "1"
        run: go test -count=1 ./internal/capture/ ./internal/exitnode/

  # The container image (Dockerfile), built and run without a tailnet login:
  # mitmproxy offline, reqcove mcp from another container, the lock, docker stop.
  container:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/container-smoke.sh

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      # Fails on a known vulnerability the code can reach.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      # mitmproxy's lock: it matches its launcher, and no package in it has a
      # known vulnerability.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: mitmproxy lock
        run: uv lock --script internal/capture/mitm.py --check
      - name: pip-audit
        run: |
          uv export --script internal/capture/mitm.py --no-header -q -o "$RUNNER_TEMP/mitm-requirements.txt"
          uvx pip-audit@2.10.1 -r "$RUNNER_TEMP/mitm-requirements.txt" --require-hashes --disable-pip --progress-spinner off
